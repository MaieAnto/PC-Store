spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/pcstore?createDatabaseIfNotExist=true&serverTimezone=Europe/Rome
spring.datasource.username=root
spring.datasource.password=mysqlpassword1_
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Sicurezza / JWT ---
# Chiave segreta con cui il server FIRMA i token JWT. Deve essere lunga almeno
# 32 caratteri (richiesto dall'algoritmo HMAC-SHA). In un progetto vero andrebbe
# tenuta fuori dal codice (variabile d'ambiente); qui la lasciamo qui per comodita'.
jwt.secret=una-chiave-segreta-molto-lunga-e-difficile-da-indovinare-per-pcstore-2026
# Durata del token in millisecondi (qui 24 ore).
jwt.expiration-ms=86400000
